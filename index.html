
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#14243b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="PTC Garage">

<title>PTC Garage Management</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">

<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 font-family:Arial,sans-serif;
 background:linear-gradient(145deg,#10243d,#1d4965);
 color:white;
}
.app{
 width:100%;
 max-width:420px;
 text-align:center;
 padding:35px 25px;
 background:rgba(255,255,255,.09);
 border:1px solid rgba(255,255,255,.15);
 border-radius:22px;
 box-shadow:0 15px 45px #0004;
}
.logo{
 width:150px;
 height:150px;
 object-fit:contain;
 margin:0 auto 20px;
}
h1{font-size:27px;margin:0 0 8px}
.sub{color:#c7d7e8;font-size:14px;line-height:1.6}
.status{
 display:inline-block;
 margin:22px 0;
 padding:8px 15px;
 border-radius:30px;
 background:#d1fae5;
 color:#166534;
 font-size:12px;
 font-weight:bold;
}
.open-btn{
 display:block;
 width:100%;
 padding:16px;
 border:0;
 border-radius:10px;
 background:#16a36a;
 color:white;
 font-size:16px;
 font-weight:bold;
 text-decoration:none;
}
.note{
 margin-top:20px;
 color:#b9c9d9;
 font-size:12px;
 line-height:1.6;
}
</style>
</head>

<body>
<main class="app">

<img class="logo" src="./icon.svg" alt="PTC Garage Logo">

<h1>PTC GARAGE</h1>
<div class="sub">
 GARAGE MANAGEMENT SYSTEM<br>
 Vehicle Entry & Exit Control
</div>

<div class="status">● ONLINE SYSTEM</div>

<a class="open-btn"
 href="https://script.google.com/macros/s/AKfycbxcjOYDJeIyCJrGMUjXRB-IHWhQwFG82s2KrMA96gpizfcAZ5lSXmbadWAy-jsa9nJgGA/exec">
 OPEN GARAGE SYSTEM
</a>

<div class="note">
 Secure login required.<br>
 Internet connection is required.
</div>

</main>

<script>
if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("./sw.js")
   .catch(error=>console.log(error));
 });
}
</script>

</body>
</html>
