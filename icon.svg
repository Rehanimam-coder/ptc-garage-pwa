
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9eef0"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#078b45"/>
      <stop offset="1" stop-color="#075b31"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect x="9" y="9" width="494" height="494" rx="92"
        fill="none" stroke="#07833d" stroke-width="13"/>

  <!-- Garage roof -->
  <path d="M65 164 L256 45 L447 164 L430 184 L256 82 L82 184Z"
        fill="#07833d"/>
  <path d="M91 174 H421 V282 H91Z" fill="#26343c"/>
  <path d="M113 190 H399 V278 H113Z" fill="#e8eef0"/>
  <path d="M105 188 V280 M407 188 V280"
        stroke="#26343c" stroke-width="13"/>

  <!-- Truck -->
  <rect x="181" y="151" width="150" height="119" rx="18" fill="#26343c"/>
  <rect x="194" y="164" width="124" height="39" rx="9" fill="#eaf3f6"/>
  <path d="M181 218 H331 L318 264 H194Z" fill="#ffffff"/>
  <rect x="207" y="222" width="98" height="29" rx="5" fill="#14243b"/>
  <text x="256" y="244" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="22"
        font-weight="bold" fill="#ffffff">PTC</text>
  <circle cx="207" cy="270" r="12" fill="#17212b"/>
  <circle cx="305" cy="270" r="12" fill="#17212b"/>

  <!-- Gear and wrench -->
  <circle cx="375" cy="220" r="43" fill="#ffffff"
          stroke="#26343c" stroke-width="15"/>
  <circle cx="375" cy="220" r="14" fill="#07833d"/>
  <path d="M345 180 L359 194 L345 208 L331 194Z"
        fill="#26343c"/>
  <path d="M393 244 L412 263 L398 278 L379 259Z"
        fill="#26343c"/>

  <!-- PTC lettering -->
  <text x="256" y="351" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="106"
        font-weight="900" fill="#08723a">PTC</text>

  <!-- Garage banner -->
  <rect x="52" y="366" width="408" height="58" rx="16" fill="#e51e25"/>
  <text x="256" y="407" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="43"
        font-weight="900" fill="#ffffff">GARAGE</text>

  <text x="256" y="456" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="23"
        font-weight="bold" letter-spacing="2" fill="#26343c">MANAGEMENT</text>

  <!-- Green and red lower accent -->
  <path d="M60 478 Q180 448 285 478 H60Z" fill="#07833d"/>
  <path d="M285 478 Q390 447 452 478 H285Z" fill="#e51e25"/>
</svg>
